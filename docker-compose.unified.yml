services:
  acsl-agent:
    platform: ${ACSL_AGENT_IMAGE_PLATFORM:-linux/amd64}
    image: acslagent-unified:latest
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        INSTALL_VERUS: ${ACSL_AGENT_INSTALL_VERUS:-1}
        BASE_IMAGE: ${ACSL_AGENT_BASE_IMAGE:-python:3.13-slim}
        APT_MIRROR: ${ACSL_AGENT_APT_MIRROR:-}
        PIP_INDEX_URL: ${ACSL_AGENT_PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${ACSL_AGENT_PIP_EXTRA_INDEX_URL:-}
        NPM_REGISTRY: ${ACSL_AGENT_NPM_REGISTRY:-}
        HTTP_PROXY: ${ACSL_AGENT_HTTP_PROXY:-}
        HTTPS_PROXY: ${ACSL_AGENT_HTTPS_PROXY:-}
        NO_PROXY: ${ACSL_AGENT_NO_PROXY:-}
    container_name: acsl-agent-unified
    env_file:
      - .env
    environment:
      ACSL_AGENT_RUNTIME_ROOT: /opt/acsl-agent/agents
      ACSL_AGENT_LOCAL_TOOLCHAIN: "1"
      ACSL_AGENT_ALLOWED_ORIGINS: ${ACSL_AGENT_ALLOWED_ORIGINS:-}
      QWEN_MIX64_API_KEY: ${QWEN_MIX64_API_KEY:-}
      DEEPSEEK_ORCHESTRATOR_BASE_URL: ${DEEPSEEK_ORCHESTRATOR_BASE_URL:-}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
