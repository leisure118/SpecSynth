services:
  # Verification-only service: reuse the installed toolchain image without model credentials.
  verifier:
    image: junjiehu1905/autospec:latest
    platform: linux/amd64
    cpus: ${XUANJIAN_PROOF_CPUS:-2.0}
    working_dir: /app
    environment:
      PATH: /root/.opam/default/bin:/opt/clang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./:/app
    command: /bin/sh

  autospec:
    cpus: ${XUANJIAN_PROOF_CPUS:-0.0}
    image: junjiehu1905/autospec:latest
    platform: linux/amd64
    container_name: autospec-dev
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      aliyun_API_KEY: ${aliyun_API_KEY:-}
      volcano_API_KEY: ${volcano_API_KEY:-}
      deepseek_API_KEY: ${deepseek_API_KEY:-}
      QWEN_MIX64_API_KEY: ${QWEN_MIX64_API_KEY:-}
      DEEPSEEK_ORCHESTRATOR_BASE_URL: ${DEEPSEEK_ORCHESTRATOR_BASE_URL:-}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-}
      QWEN35_4B_MIX46_API_BASE_URL: ${QWEN35_4B_MIX46_DOCKER_BASE_URL:-}
      QWEN35_4B_MIX64_API_BASE_URL: ${QWEN35_4B_MIX64_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX28_API_BASE_URL: ${QWEN35_9B_MIX28_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX46_API_BASE_URL: ${QWEN35_9B_MIX46_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX82_API_BASE_URL: ${QWEN35_9B_MIX82_DOCKER_BASE_URL:-}
      QWEN35_9B_ONLY1_API_BASE_URL: ${QWEN35_9B_ONLY1_DOCKER_BASE_URL:-}
      QWEN35_9B_ONLY2_API_BASE_URL: ${QWEN35_9B_ONLY2_DOCKER_BASE_URL:-}
    volumes:
      - ./:/app
    command: /bin/bash

  termination:
    image: junjiehu1905/termination_analysis:latest
    platform: linux/amd64
    container_name: autospec-termination
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      aliyun_API_KEY: ${aliyun_API_KEY:-}
      volcano_API_KEY: ${volcano_API_KEY:-}
      deepseek_API_KEY: ${deepseek_API_KEY:-}
      QWEN_MIX64_API_KEY: ${QWEN_MIX64_API_KEY:-}
      DEEPSEEK_ORCHESTRATOR_BASE_URL: ${DEEPSEEK_ORCHESTRATOR_BASE_URL:-}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-}
      QWEN35_4B_MIX46_API_BASE_URL: ${QWEN35_4B_MIX46_DOCKER_BASE_URL:-}
      QWEN35_4B_MIX64_API_BASE_URL: ${QWEN35_4B_MIX64_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX28_API_BASE_URL: ${QWEN35_9B_MIX28_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX46_API_BASE_URL: ${QWEN35_9B_MIX46_DOCKER_BASE_URL:-}
      QWEN35_9B_MIX82_API_BASE_URL: ${QWEN35_9B_MIX82_DOCKER_BASE_URL:-}
      QWEN35_9B_ONLY1_API_BASE_URL: ${QWEN35_9B_ONLY1_DOCKER_BASE_URL:-}
      QWEN35_9B_ONLY2_API_BASE_URL: ${QWEN35_9B_ONLY2_DOCKER_BASE_URL:-}
    volumes:
      - ./:/app
    command: /bin/bash
