services:
  autospec:
    image: junjiehu1905/autospec:latest
    platform: linux/amd64
    container_name: autospec-dev
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      aliyun_API_KEY: ${aliyun_API_KEY:-}
      volcano_API_KEY: ${volcano_API_KEY:-}
      deepseek_API_KEY: ${deepseek_API_KEY:-}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-http://host.docker.internal:18001/v1}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-http://host.docker.internal:18002/v1}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-http://host.docker.internal:18003/v1}
      QWEN35_4B_MIX46_API_BASE_URL: ${QWEN35_4B_MIX46_DOCKER_BASE_URL:-http://host.docker.internal:18004/v1}
      QWEN35_4B_MIX64_API_BASE_URL: ${QWEN35_4B_MIX64_DOCKER_BASE_URL:-http://host.docker.internal:18005/v1}
      QWEN35_9B_MIX28_API_BASE_URL: ${QWEN35_9B_MIX28_DOCKER_BASE_URL:-http://host.docker.internal:18006/v1}
      QWEN35_9B_MIX46_API_BASE_URL: ${QWEN35_9B_MIX46_DOCKER_BASE_URL:-http://host.docker.internal:18007/v1}
      QWEN35_9B_MIX82_API_BASE_URL: ${QWEN35_9B_MIX82_DOCKER_BASE_URL:-http://host.docker.internal:18008/v1}
      QWEN35_9B_ONLY1_API_BASE_URL: ${QWEN35_9B_ONLY1_DOCKER_BASE_URL:-http://host.docker.internal:18009/v1}
      QWEN35_9B_ONLY2_API_BASE_URL: ${QWEN35_9B_ONLY2_DOCKER_BASE_URL:-http://host.docker.internal:18010/v1}
    volumes:
      - ./:/app
    command: /bin/bash

  termination:
    image: junjiehu1905/termination_analysis:latest
    platform: linux/amd64
    container_name: autospec-termination
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      aliyun_API_KEY: ${aliyun_API_KEY:-}
      volcano_API_KEY: ${volcano_API_KEY:-}
      deepseek_API_KEY: ${deepseek_API_KEY:-}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-http://host.docker.internal:18001/v1}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-http://host.docker.internal:18002/v1}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-http://host.docker.internal:18003/v1}
      QWEN35_4B_MIX46_API_BASE_URL: ${QWEN35_4B_MIX46_DOCKER_BASE_URL:-http://host.docker.internal:18004/v1}
      QWEN35_4B_MIX64_API_BASE_URL: ${QWEN35_4B_MIX64_DOCKER_BASE_URL:-http://host.docker.internal:18005/v1}
      QWEN35_9B_MIX28_API_BASE_URL: ${QWEN35_9B_MIX28_DOCKER_BASE_URL:-http://host.docker.internal:18006/v1}
      QWEN35_9B_MIX46_API_BASE_URL: ${QWEN35_9B_MIX46_DOCKER_BASE_URL:-http://host.docker.internal:18007/v1}
      QWEN35_9B_MIX82_API_BASE_URL: ${QWEN35_9B_MIX82_DOCKER_BASE_URL:-http://host.docker.internal:18008/v1}
      QWEN35_9B_ONLY1_API_BASE_URL: ${QWEN35_9B_ONLY1_DOCKER_BASE_URL:-http://host.docker.internal:18009/v1}
      QWEN35_9B_ONLY2_API_BASE_URL: ${QWEN35_9B_ONLY2_DOCKER_BASE_URL:-http://host.docker.internal:18010/v1}
    volumes:
      - ./:/app
    command: /bin/bash
