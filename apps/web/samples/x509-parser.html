<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>x509 Parser Call Graph — Verification</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ffffff; font-family:'SF Mono','Fira Code',monospace; overflow:auto; min-width:0; }

/* Layout */
.container { display:flex; width:100%; min-width:0; height:100vh; min-height:550px; }
#graph { flex:3; min-width:0; overflow:hidden; position:relative; }
#graph svg { width:100%; height:100%; }

/* Right info panel */
#panel {
  flex:1; background:#f8fafc; border-left:1px solid #e2e8f0;
  padding:20px; overflow-y:auto; color:#1e293b; font-size:13px; line-height:1.6;
  min-width:280px;
}
#panel .empty { color:#94a3b8; text-align:center; margin-top:40%; font-size:14px; }
#panel .func-name { font-size:18px; font-weight:700; color:#0f172a; margin-bottom:6px; }
#panel .func-layer { color:#64748b; font-size:13px; margin-bottom:4px; }
#panel .function-evidence-button { width:100%; margin:12px 0 2px; padding:8px 10px; border:1px solid #b9cbe4; border-radius:6px; color:#285b99; background:#eef5ff; font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; cursor:pointer; }
#panel .function-evidence-button:hover { border-color:#5b8fd0; background:#dfeeff; }
#panel .status-badge { display:inline-block; padding:2px 10px; border-radius:4px; font-size:12px; font-weight:600; }
#panel .status-pass { background:rgba(72,187,120,0.2); color:#48bb78; }
#panel .status-fail { background:rgba(245,101,101,0.2); color:#f56565; }
#panel .section { margin-top:14px; }
#panel .section-title { font-size:11px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px; margin-bottom:6px; }
#panel ul { list-style:none; padding:0; }
#panel li { padding:3px 8px; border-radius:4px; margin:2px 0; display:flex; justify-content:space-between; align-items:center; }
#panel li .fn { color:#475569; }
#panel li .badge { font-size:10px; padding:1px 6px; border-radius:3px; }
#panel li:hover { background:#f1f5f9; }

/* Function evidence dialog */
.function-dialog { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(15,23,42,.56); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
.function-dialog.open { display:flex; }
.function-dialog-card { width:min(1380px,96vw); max-height:92vh; overflow:hidden; border-radius:14px; background:#fff; box-shadow:0 26px 80px rgba(15,23,42,.35); display:flex; flex-direction:column; }
.function-dialog-head { display:flex; align-items:flex-start; gap:16px; padding:18px 22px; border-bottom:1px solid #e2e8f0; }
.function-dialog-title { min-width:0; flex:1; }.function-dialog-title strong { display:block; color:#0f172a; font:700 17px 'SF Mono','Fira Code',monospace; overflow-wrap:anywhere; }.function-dialog-title small { display:block; color:#64748b; margin-top:5px; font-size:12px; }
.function-dialog-close { border:0; border-radius:7px; padding:7px 11px; background:#eef2f7; color:#334155; font:600 13px inherit; cursor:pointer; }
.function-dialog-body { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1px; min-height:0; overflow:auto; background:#e2e8f0; }
.function-source-pane { min-width:0; background:#fff; padding:16px; }.function-source-pane h2 { margin:0 0 6px; color:#1e293b; font-size:14px; }.function-source-pane p { margin:0 0 12px; color:#64748b; font:11px 'SF Mono','Fira Code',monospace; overflow-wrap:anywhere; }
.function-source-pane pre { margin:0; padding:14px; min-height:340px; overflow:auto; white-space:pre; border:1px solid #e2e8f0; border-radius:8px; background:#0f172a; color:#dbeafe; font:12px/1.65 'SF Mono','Fira Code',monospace; }
.function-source-pane.verified pre { color:#c4f1df; }.function-dialog-loading { padding:40px; color:#64748b; }
@media (max-width:760px) { .function-dialog { padding:10px; }.function-dialog-body { grid-template-columns:1fr; }.function-source-pane pre { min-height:240px; }.function-dialog-card { max-height:96vh; } }

/* Info bar */
.info-bar {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,0.92); border:1px solid #e2e8f0;
  border-radius:8px; padding:6px 18px; backdrop-filter:blur(8px);
  z-index:10; color:#475569; font-size:13px; text-align:center;
  pointer-events:none; white-space:nowrap;
}
.info-bar .pass { color:#48bb78; }
.info-bar .fail { color:#f56565; }

/* Legend */
.legend {
  position:absolute; bottom:24px; left:24px; display:flex; gap:14px; align-items:center;
  background:rgba(255,255,255,0.92); border:1px solid #e2e8f0;
  border-radius:8px; padding:8px 14px; backdrop-filter:blur(8px); z-index:10;
}
.legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:#64748b; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
.legend-line { width:18px; height:2px; }
.legend-line.adj { background:#718096; }
.legend-line.cross { background:#4a5568; opacity:0.35; }
/* Fit the embedded project editor as well as the standalone view. */
.info-bar{max-width:calc(100% - 24px);white-space:normal;width:max-content;font-size:11px;line-height:1.6;padding:6px 12px}
.legend{max-width:calc(100% - 24px);flex-wrap:wrap;gap:8px;left:12px;bottom:12px;padding:6px 9px}.legend-item{font-size:9px}
@media(max-width:900px){.container{flex-direction:column}#graph{flex:1;min-height:360px}#panel{flex:0 0 190px;min-width:0;border-left:0;border-top:1px solid #e2e8f0;padding:14px}#panel .empty{margin:30px auto}}
</style>
</head>

const dialog = document.getElementById('function-dialog');
const dialogName = document.getElementById('function-dialog-name');
const dialogMeta = document.getElementById('function-dialog-meta');
const dialogBody = document.getElementById('function-dialog-body');

function closeFunctionDialog() { dialog.classList.remove('open'); }
function sourcePane(title, path, content, verified) {
  const pane = document.createElement('section');
  pane.className = 'function-source-pane' + (verified ? ' verified' : '');
  const heading = document.createElement('h2'); heading.textContent = title;
  const label = document.createElement('p'); label.textContent = path;
  const code = document.createElement('pre'); code.textContent = content;
  pane.append(heading, label, code);
  return pane;
}
async function openFunctionDialog(node) {
  dialog.classList.add('open');
  dialogName.textContent = node.id;
  dialogMeta.textContent = `第 ${node.layer} 层 · ${node.status === 'pass' ? '验证通过' : '存在未证目标'} · ${node.proved}`;
  dialogBody.replaceChildren(Object.assign(document.createElement('div'), { className: 'function-dialog-loading', textContent: '正在读取函数规约与源码…' }));
  try {
    const response = await fetch(`/api/v1/showcases/x509/functions/${encodeURIComponent(node.id)}`);
    if (!response.ok) throw new Error(`请求失败（${response.status}）`);
    const detail = await response.json();
    if (!dialog.classList.contains('open')) return;
    dialogMeta.textContent = `${detail.signature} · ${detail.proved}${detail.failed_reason ? ` · ${detail.failed_reason}` : ''}`;
    dialogBody.replaceChildren(
      sourcePane('切分验证函数（含 ACSL 规约）', detail.verified_source_path, detail.verified_source || detail.contract, true),
      sourcePane('原始工程源码', `x509-parser-bench/${detail.source_path}`, detail.source, false),
    );
  } catch (error) {
    dialogBody.replaceChildren(Object.assign(document.createElement('div'), { className: 'function-dialog-loading', textContent: `无法载入函数详情：${error.message}` }));
  }
}
document.getElementById('function-dialog-close').addEventListener('click', closeFunctionDialog);
dialog.addEventListener('click', event => { if (event.target === dialog) closeFunctionDialog(); });
window.addEventListener('keydown', event => { if (event.key === 'Escape') closeFunctionDialog(); });

function render() {
  const { nodes, edges } = DATA;

  // Build adjacency maps
  const callees = {};  // node -> direct callees
  const callers = {};  // node -> direct callers
  nodes.forEach(n => { callees[n.id] = new Set(); callers[n.id] = new Set(); });
  edges.forEach(e => { callees[e.source].add(e.target); callers[e.target].add(e.source); });

  // SVG
  const width = document.getElementById('graph').clientWidth;
  const height = document.getElementById('graph').clientHeight;
  const svg = d3.select('#graph svg').attr('width', width).attr('height', height);
  const g = svg.append('g');

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.15, 3]).on('zoom', ev => g.attr('transform', ev.transform)));

  // Layout: layer-based
  const layerGroups = {};
  nodes.forEach(n => { (layerGroups[n.layer] ??= []).push(n); });
  const maxLayer = d3.max(nodes, n => n.layer);
  const layerH = (height - 140) / (maxLayer + 1);

  nodes.forEach(n => n.y = height - 70 - n.layer * layerH);

  Object.keys(layerGroups).forEach(l => {
    const funcs = layerGroups[l];
    funcs.sort((a, b) => a.status === 'fail' ? -1 : b.status === 'fail' ? 1 : a.id.localeCompare(b.id));
    const sp = Math.min(26, (width - 100) / (funcs.length + 1));
    const sx = (width - (funcs.length - 1) * sp) / 2;
    funcs.forEach((n, i) => {
      n.x = sx + i * sp + (Math.random() - 0.5) * sp * 0.5;
      n.x = Math.max(15, Math.min(width - 15, n.x));
    });
  });

  // Store original radius
  nodes.forEach(n => n._r = 4 + Math.min(5, n.callee_count * 0.4) + (n.status === 'fail' ? 2 : 0));

  // Draw edges
  const link = g.append('g').selectAll('line').data(edges).join('line')
    .attr('x1', e => { const s = nodes.find(n => n.id === e.source); return s ? s.x : 0; })
    .attr('y1', e => { const s = nodes.find(n => n.id === e.source); return s ? s.y : 0; })
    .attr('x2', e => { const t = nodes.find(n => n.id === e.target); return t ? t.x : 0; })
    .attr('y2', e => { const t = nodes.find(n => n.id === e.target); return t ? t.y : 0; })
    .attr('stroke', e => e.layer_dist <= 1 ? '#718096' : '#4a5568')
    .attr('stroke-opacity', e => e.layer_dist <= 1 ? 0.35 : 0.12)
    .attr('stroke-width', e => e.layer_dist <= 1 ? 1.0 : 0.5);

  // Draw nodes
  const node = g.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('cx', n => n.x).attr('cy', n => n.y).attr('r', n => n._r)
    .attr('fill', n => n.status === 'pass' ? '#48bb78' : n.status === 'fail' ? '#f56565' : '#4a5568')
    .attr('stroke', n => n.status === 'pass' ? '#2f855a' : '#c53030')
    .attr('stroke-width', 1.5)
    .style('cursor', 'pointer');

  // Layer labels
  Object.keys(layerGroups).sort((a,b) => b - a).forEach(l => {
    const y = height - 70 - parseInt(l) * layerH;
    g.append('text').attr('x', 12).attr('y', y + 4)
      .attr('fill', '#64748b').attr('font-size', '13px')
      .attr('font-family', 'monospace').attr('font-weight', 'bold')
      .text(`L${l}`);
  });

  // ─── Click handler ───
  let selectedId = null;

  function getTransitiveCallees(id) {
    const visited = new Set();
    const q = [id];
    while (q.length) {
      const cur = q.shift();
      if (callees[cur]) callees[cur].forEach(c => { if (!visited.has(c)) { visited.add(c); q.push(c); } });
    }
    return visited;
  }

  function getImmediateCallers(id) {
    return callers[id] || new Set();
  }

  function hasDirectEdge(a, b) {
    return edges.some(e => e.source === a && e.target === b) ||
           edges.some(e => e.source === b && e.target === a);
  }

  function selectNode(ev, d) {
    ev.stopPropagation();
    selectedId = d.id;

    // Get highlight sets
    const downChain = getTransitiveCallees(d.id);
    const upDirect = getImmediateCallers(d.id);
    const highlighted = new Set([d.id, ...downChain, ...upDirect]);
    const yellowEdges = new Set();
    // Direct edges from selected node (both directions): caller → selected and selected → callee
    downChain.forEach(c => { if (hasDirectEdge(d.id, c)) yellowEdges.add(d.id + '::' + c); });
    upDirect.forEach(c => { if (hasDirectEdge(d.id, c)) yellowEdges.add(c + '::' + d.id); });

    // Dim/light nodes
    node.attr('opacity', n => highlighted.has(n.id) ? 1 : 0.06);
    node.attr('stroke', n => {
      if (n.id === d.id) return '#f59e0b';
      if (highlighted.has(n.id)) return n.status === 'pass' ? '#22c55e' : '#ef4444';
      return '#e2e8f0';
    });
    node.attr('stroke-width', n => highlighted.has(n.id) ? 2.5 : 0.3);
    node.attr('r', n => n.id === d.id ? n._r * 1.6 : highlighted.has(n.id) ? n._r * 1.1 : n._r * 0.5);

    // Highlight edges
    link.attr('stroke', e => {
      const key1 = e.source + '::' + e.target;
      const key2 = e.target + '::' + e.source;
      if (yellowEdges.has(key1) || yellowEdges.has(key2)) return '#ecc94b';
      if (highlighted.has(e.source) && highlighted.has(e.target)) return '#64748b';
      return '#e2e8f0';
    });
    link.attr('stroke-opacity', e => {
      const key1 = e.source + '::' + e.target;
      const key2 = e.target + '::' + e.source;
      if (yellowEdges.has(key1) || yellowEdges.has(key2)) return 0.9;
      if (highlighted.has(e.source) && highlighted.has(e.target)) return 0.5;
      return 0.01;
    });
    link.attr('stroke-width', e => {
      const key1 = e.source + '::' + e.target;
      const key2 = e.target + '::' + e.source;
      if (yellowEdges.has(key1) || yellowEdges.has(key2)) return 2.5;
      if (highlighted.has(e.source) && highlighted.has(e.target)) return 0.8;
      return 0.1;
    });

    // Keep the graph visible so the selected function's callers and callees
    // remain available in the panel on the right.
    updatePanel(d, downChain, upDirect);
  }

  node.on('click', selectNode);
  node.on('dblclick', selectNode);

  function openFunctionEvidence(d) {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'x509-function-selected', name: d.id }, window.location.origin);
    } else {
      openFunctionDialog(d);
    }
  }

  function updatePanel(d, downChain, upDirect) {
    const panel = document.getElementById('panel');
    const depsList = Array.from(downChain).sort();
    const upList = Array.from(upDirect).sort();
    let sigDisplay = (d.signature || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (sigDisplay.length > 80) sigDisplay = sigDisplay.substring(0,80) + '…';

    panel.innerHTML = `
      <div class="func-name">${d.id} <span class="status-badge status-${d.status}">${d.status}</span></div>
      <div class="func-layer">Layer ${d.layer} · Proved: ${d.proved || 'N/A'} · Direct callees: ${d.callee_count} · Callers: ${upList.length}</div>
      <div class="func-layer" style="font-size:11px;color:#6a7490">${sigDisplay}</div>
      <button class="function-evidence-button" type="button">查看函数规约与源码</button>

      <div class="section">
        <div class="section-title">Callers (direct, up 1 layer)</div>
        <ul>${upList.length ? upList.map(n => {
          const e = DATA.nodes.find(x => x.id === n);
          const s = e ? e.status : '?';
          const p = e ? (e.proved || '') : '';
          return `<li><span class="fn">${n}</span><span class="badge" style="background:${s === 'pass' ? 'rgba(72,187,120,0.15)' : 'rgba(245,101,101,0.15)'};color:${s === 'pass' ? '#48bb78' : '#f56565'}">${s} ${p}</span></li>`;
        }).join('') : '<li style="color:#94a3b8">None (leaf)</li>'}
        </ul>
      </div>

      <div class="section">
        <div class="section-title">Dependency chain (transitive callees → L0)</div>
        <ul>${depsList.length ? depsList.slice(0, 30).map(n => {
          const e = DATA.nodes.find(x => x.id === n);
          const s = e ? e.status : '?';
          const p = e ? (e.proved || '') : '';
          return `<li><span class="fn">${n}</span><span class="badge" style="background:${s === 'pass' ? 'rgba(72,187,120,0.15)' : 'rgba(245,101,101,0.15)'};color:${s === 'pass' ? '#48bb78' : '#f56565'}">${s} ${p}</span></li>`;
        }).join('') : '<li style="color:#94a3b8">None (singleton)</li>'}
        ${depsList.length > 30 ? `<li style="color:#94a3b8;font-style:italic">... and ${depsList.length - 30} more</li>` : ''}
        </ul>
      </div>
    `;
    panel.querySelector('.function-evidence-button').addEventListener('click', () => openFunctionEvidence(d));
  }

  // Click on background to deselect
  svg.on('click', function(ev) {
    if (ev.target.tagName === 'svg' || ev.target.tagName === 'g') {
      selectedId = null;
      node.attr('opacity', 1);
      node.attr('stroke', n => n.status === 'pass' ? '#2f855a' : '#c53030');
      node.attr('stroke-width', 1.5);
      node.attr('r', n => n._r);
      link.attr('stroke', e => e.layer_dist <= 1 ? '#94a3b8' : '#cbd5e1');
      link.attr('stroke-opacity', e => e.layer_dist <= 1 ? 0.5 : 0.2);
      link.attr('stroke-width', e => e.layer_dist <= 1 ? 1.0 : 0.5);
      document.getElementById('panel').innerHTML = '<div class="empty">点击查看调用关系</div>';
    }
  }, true);
}

let previousSize='';
function resizeGraph(){
  const graph=document.getElementById('graph');
  const size=graph.clientWidth+':'+graph.clientHeight;
  if(size===previousSize)return;
  previousSize=size;
  d3.select('#graph svg').selectAll('*').remove();
  render();
}
new ResizeObserver(resizeGraph).observe(document.getElementById('graph'));
resizeGraph();
</script>
</body>
</html>
