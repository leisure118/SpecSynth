services:
  acsl-agent:
    image: acslagent-unified:offline
    container_name: acsl-agent-unified
    env_file:
      - .env
    environment:
      ACSL_AGENT_LOCAL_TOOLCHAIN: "1"
      ACSL_AGENT_ALLOWED_ORIGINS: ${ACSL_AGENT_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      QWEN35_4B_API_BASE_URL: ${QWEN35_4B_DOCKER_BASE_URL:-http://host.docker.internal:18001/v1}
      QWEN35_9B_API_BASE_URL: ${QWEN35_9B_DOCKER_BASE_URL:-http://host.docker.internal:18002/v1}
      QWEN35_9B_MIX64_API_BASE_URL: ${QWEN35_9B_MIX64_DOCKER_BASE_URL:-http://host.docker.internal:18003/v1}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
